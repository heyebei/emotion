<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f0ec" />
    <meta name="description" content="新增一张情绪日记卡片" />
    <title>新增日记卡片</title>
    <link rel="stylesheet" href="./editor.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="panel">
        <div class="editor-heading">
          <h1>新增日记卡片</h1>
          <button type="button" class="secondary logout-button" id="logout-btn">退出登录</button>
        </div>
        <form id="diary-form">
          <div class="grid">
            <div>
              <label>日期<input id="entry-date" name="date" type="date" required /></label>
              <label>上传照片（原图）<input id="image-input" name="images" type="file" accept="image/*" multiple required /></label>
              <div id="file-list" class="status">未选择图片</div>
            </div>
            <div>
              <label>内容<textarea id="entry-text" name="content" placeholder="写下你的心事..." required></textarea></label>
            </div>
          </div>
          <div class="preview"><h2>生成结果预览</h2><pre id="markdown-output">请输入日期和内容</pre></div>
          <div class="actions">
            <button type="submit">保存到仓库</button>
            <button type="button" class="secondary" id="preview-btn">仅预览</button>
            <button type="button" class="secondary" id="back-btn">返回主页</button>
          </div>
        </form>
        <div id="status" class="status" aria-live="polite"></div>
      </div>
    </div>
    <script src="./editor.js" defer></script>
  </body>
</html>
