<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f0ec" />
    <meta name="description" content="登录后新增情绪日记卡片" />
    <title>登录 · 情绪日记</title>
    <link rel="stylesheet" href="../styles/login.css" />
  </head>
  <body>
    <main class="wrap">
      <section class="panel">
        <p class="eyebrow">PRIVATE EDITOR</p>
        <h1>登录后继续</h1>
        <p class="intro">请验证账号和密码后进入日记编辑器。</p>
        <form id="login-form">
          <label>账号<input id="username" name="username" autocomplete="username" required /></label>
          <label>密码<input id="password" name="password" type="password" autocomplete="current-password" required /></label>
          <button id="login-button" type="submit">登录</button>
          <p id="login-status" class="status" role="status" aria-live="polite"></p>
        </form>
        <a class="home-link" href="./index.html">返回日记主页</a>
      </section>
    </main>
    <script src="../scripts/login.js" defer></script>
  </body>
</html>
