<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="把写过的日子，一张一张收进时光卡片里。"
    />
    <meta name="theme-color" content="#f6f3ed" />
    <title>时光卡片 · 日记</title>
    <link rel="stylesheet" href="./pages/css/styles.css" />
    <script src="./pages/js/app.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="时光卡片首页">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <path
                d="M7.5 9.5h17v16h-17z"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <path
                d="M11 6.5h13.5v16M11 14h10m-10 4h7"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-width="1.5"
              />
            </svg>
          </span>
          <span class="brand-copy">
            <span class="brand-name">时光卡片</span>
            <span class="brand-caption">把日子，慢慢收藏</span>
          </span>
        </a>
        <div class="topbar-actions">
          <span class="collection-label">MY JOURNAL</span>
          <a class="create-button" id="create-button" href="./pages/html/new.html">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path
                d="M10 4v12M4 10h12"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-width="1.7"
              />
            </svg>
            <span>新建</span>
          </a>
        </div>
      </header>

      <div class="workspace" id="workspace">
        <aside class="timeline-panel" aria-label="日记时间轴">
          <div class="timeline-heading">
            <div>
              <p class="eyebrow">THE YEARS WE KEPT</p>
              <h1>日记时间轴</h1>
            </div>
            <span class="entry-count" id="entry-count">—</span>
          </div>
          <p class="timeline-hint">选择一个日子，重新读一遍当时的心情</p>
          <nav class="timeline" id="timeline" aria-label="选择日记"></nav>
          <div class="timeline-footer">
            <span class="timeline-footer-mark" aria-hidden="true">✳</span>
            <span>每一页，都值得被记得</span>
          </div>
        </aside>

        <main class="diary-panel" id="diary-panel" aria-live="polite">
          <div class="diary-toolbar">
            <div class="reading-label">
              <span class="reading-dot" aria-hidden="true"></span>
              <span id="reading-label">正在翻阅</span>
            </div>
            <div class="card-navigation">
              <span class="card-position" id="card-position">— / —</span>
              <button
                class="nav-button"
                id="previous-button"
                type="button"
                aria-label="上一张日记卡片"
                title="上一张"
              >
                <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <path
                    d="m12 4-6 6 6 6"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.6"
                  />
                </svg>
              </button>
              <button
                class="nav-button"
                id="next-button"
                type="button"
                aria-label="下一张日记卡片"
                title="下一张"
              >
                <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <path
                    d="m8 4 6 6-6 6"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.6"
                  />
                </svg>
              </button>
            </div>
          </div>
          <article class="diary-card" id="diary-card"></article>
          <p class="keyboard-hint">
            <span>←</span><span>→</span>
            <span>也可以用键盘翻阅</span>
          </p>
        </main>
      </div>

      <div class="status-message" id="status-message" role="status" hidden></div>
    </div>
  </body>
</html>
